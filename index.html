<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paytonology</title>
    <link rel="stylesheet" href="styles/content.css">
    <style>
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(147, 51, 234, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header>
            <h1>PAYTONOLOGY</h1>
            <p class="subtitle">Mobile Apps by Caleb Payton</p>
        </header>

        <!-- Apps Portfolio Section -->
        <main class="apps-list">

            <!-- App Item 1 -->
            <div class="app-card">
                <img src="assets/odaat-icon.png" alt="One Day at a Time Icon" class="app-icon" onerror="this.style.backgroundColor='#3b82f6'">
                <div class="app-info">
                    <h2 class="app-title">One Day at a Time</h2>
                    <p class="app-description">Recovery happens one day at a time. Reflect, take inventory, and keep moving forward with One Day at a Time, the app.</p>
                    <a href="privacy/odaat.html" class="privacy-link">Privacy Policy →</a>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
